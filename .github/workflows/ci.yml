name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: 8.5
          extensions: dom, json, libxml, mbstring, xml, xmlwriter, xdebug

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4.3.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run ECS (Easy Coding Standard)
        run: vendor/bin/ecs check

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

      - name: Run PHPUnit tests with coverage
        run: XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage.xml
          retention-days: 1

  # Runs separately so that composer dependencies never see a write token.
  octocov:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Download coverage
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage

      - name: Run octocov
        uses: k1LoW/octocov-action@v1.5.2
